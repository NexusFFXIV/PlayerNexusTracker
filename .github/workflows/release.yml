name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # DalamudPackager uses Path.DirectorySeparatorChar for ZIP entry names.
    # Build/package on Linux so the packager itself emits ZIP-standard `/`
    # separators; the net10.0-windows plugin remains usable on Windows and
    # Linux/Wine. The generated ZIP is not rewritten afterwards.
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # for creating GitHub Releases on tag
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Dalamud
        shell: pwsh
        run: |
          $hookDir = Join-Path $HOME ".xlcore/dalamud/Hooks/dev"
          New-Item -ItemType Directory -Path $hookDir -Force | Out-Null
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Path latest.zip -DestinationPath $hookDir -Force

      - name: Restore
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore PlayerNexusTracker.sln

      - name: Audit NuGet dependencies for known vulnerabilities
        shell: pwsh
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $output = dotnet list PlayerNexusTracker.sln package --vulnerable --include-transitive 2>&1 | Out-String
          Write-Host $output
          if ($output -match '\b(High|Critical)\b') {
            Write-Host "::error::Vulnerable NuGet dependency at High or Critical severity — review the report above and update before merging."
            exit 1
          }

      - name: List outdated NuGet dependencies (informational)
        continue-on-error: true
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet list PlayerNexusTracker.sln package --outdated --include-transitive

      # The version the plugin reports has to be the tag being released. Dalamud
      # decides whether an update exists by comparing the AssemblyVersion in
      # pluginmaster.json against the installed assembly, so a version that does
      # not track the tag means users are silently never offered the update — that
      # is how v0.2.0 shipped as 0.1.2.0. Passing it on the command line makes the
      # tag the single source; the csproj holds only a 0.0.0.0 dev placeholder.
      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $full = $tag.TrimStart('v')                    # 0.2.0 or 0.2.0-rc.1
          $numeric = ($full -split '-')[0]               # AssemblyVersion has no pre-release part
          if ($numeric -notmatch '^\d+\.\d+\.\d+$') {
            Write-Host "::error::Tag '$tag' does not look like vMAJOR.MINOR.PATCH[-suffix]; refusing to guess a version."
            exit 1
          }
          "full=$full"               >> $env:GITHUB_OUTPUT
          "assembly=$numeric.0"      >> $env:GITHUB_OUTPUT
          Write-Host "Version=$full  AssemblyVersion=$numeric.0"

      - name: Build (Release)
        env:
          GITHUB_PACKAGES_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet build PlayerNexusTracker.sln -c Release -p:Platform=x64 --no-restore
          ${{ startsWith(github.ref, 'refs/tags/v') && format('-p:Version={0}', steps.version.outputs.full) || '' }}

      - name: Package plugin
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $artifactDir = "./artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null
          $binDir = "./PlayerNexusTracker.Plugin/bin/x64/Release"
          # DalamudPackager creates the plugin distribution zip + the .json manifest
          # under the project's bin output. We attach BOTH as release assets so the
          # NexusFFXIV/DalamudRepo pluginmaster-build script can read the manifest
          # without having to unzip the plugin payload.
          #
          # DalamudPackager emits `<binDir>/<InternalName>/latest.zip` (the
          # distribution bundle, ONLY the runtime files) plus a copy of the
          # manifest at the same depth. The full bin/ tree contains many more
          # files which Dalamud doesn't need (and which would bloat the zip).
          $zip = Get-ChildItem -Recurse -Path $binDir -Filter "latest.zip" | Select-Object -First 1
          if (-not $zip) {
            Write-Warning "DalamudPackager output 'latest.zip' not found — falling back to a Compress-Archive of the bin tree (larger than ideal, may include unused files)."
            Compress-Archive -Path "$binDir/*" -DestinationPath "$artifactDir/PlayerNexusTracker-$version.zip" -Force
          } else {
            Copy-Item $zip.FullName "$artifactDir/PlayerNexusTracker-$version.zip"
          }
          # Prefer the manifest next to latest.zip (clean DalamudPackager output)
          # over the one at the bin root.
          $json = Get-ChildItem -Recurse -Path $binDir -Filter "PlayerNexusTracker.json" | Sort-Object FullName | Select-Object -First 1
          if ($json) {
            Copy-Item $json.FullName "$artifactDir/PlayerNexusTracker.json"
          } else {
            Write-Warning "PlayerNexusTracker.json manifest not found in bin output — DalamudRepo update will skip this release."
          }
          Get-ChildItem $artifactDir

      # Last line of defence. Everything above can be correct and a future change
      # can still reintroduce a version that does not match the tag — a hardcoded
      # <Version>, a packager change, a stale obj/ tree. Publishing that is far
      # worse than failing here: pluginmaster.json would advertise a version users
      # already have, so the release reaches nobody and nothing looks broken.
      - name: Verify manifest version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.assembly }}"
          $manifestPath = "./artifacts/PlayerNexusTracker.json"
          if (-not (Test-Path $manifestPath)) {
            Write-Host "::error::$manifestPath is missing, so the release would ship without a manifest and DalamudRepo would skip it."
            exit 1
          }
          $actual = (Get-Content $manifestPath -Raw | ConvertFrom-Json).AssemblyVersion
          Write-Host "tag=${{ github.ref_name }}  expected=$expected  manifest=$actual"
          if ($actual -ne $expected) {
            Write-Host "::error::Manifest AssemblyVersion '$actual' does not match tag ${{ github.ref_name }} (expected '$expected'). Dalamud compares this value to decide whether an update exists, so shipping it would make the release invisible to anyone already on '$actual'."
            exit 1
          }
          # The zip is named from the tag; confirm the assembly inside agrees, so a
          # mismatch between filename and payload cannot slip through either.
          $zip = Get-ChildItem ./artifacts -Filter "PlayerNexusTracker-*.zip" | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.ZipFile
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
          } finally {
            $archive.Dispose()
          }
          $backslashEntries = @($entries | Where-Object { $_ -match '\\' })
          if ($backslashEntries.Count -gt 0) {
            Write-Host "::error::DalamudPackager produced non-portable ZIP entries containing backslashes:"
            $backslashEntries | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          # Every culture-specific .resources.dll must live below a real
          # culture directory. Do not name a specific language here: adding
          # fr, ja, or another culture must not require changing the check.
          $satelliteEntries = @($entries | Where-Object {
            $_ -match '^[^/]+/[^/]+\.resources\.dll$'
          })
          if ($satelliteEntries.Count -eq 0) {
            Write-Host "::error::The package contains no culture satellite assemblies with portable directory paths."
            exit 1
          }
          $cultures = @($satelliteEntries | ForEach-Object { ($_ -split '/', 2)[0] } | Sort-Object -Unique)
          Write-Host "ZIP entries use portable separators; satellite cultures: $($cultures -join ', ')."
          Expand-Archive $zip.FullName -DestinationPath ./verify -Force
          $dll = Get-ChildItem ./verify -Recurse -Filter "PlayerNexusTracker.dll" | Select-Object -First 1
          $dllVersion = [System.Reflection.AssemblyName]::GetAssemblyName($dll.FullName).Version.ToString()
          Write-Host "assembly in $($zip.Name) = $dllVersion"
          if ($dllVersion -ne $expected) {
            Write-Host "::error::The assembly inside $($zip.Name) reports $dllVersion, not $expected."
            exit 1
          }
          Write-Host "Tag, manifest and assembly all agree on $expected."

      - name: Upload artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: ./artifacts/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: ./artifacts/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Expand internal dependency changelog
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: NexusFFXIV/.github/.github/actions/expand-internal-deps-changelog@main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify DalamudRepo
        # Sends a repository_dispatch event to NexusFFXIV/DalamudRepo so its
        # update.yml workflow immediately rebuilds pluginmaster.json against this
        # newly published release. Requires the org secret DALAMUD_REPO_DISPATCH_TOKEN
        # (fine-grained PAT with contents:write on NexusFFXIV/DalamudRepo only).
        # If the dispatch fails (missing secret, network blip, …) the receiver
        # workflow still runs on its 6-hourly cron — this step is best-effort.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/NexusFFXIV/DalamudRepo/dispatches `
            -F event_type=plugin-release `
            -F client_payload[plugin]=PlayerNexusTracker `
            -F client_payload[tag]=${{ github.ref_name }} `
            -F client_payload[prerelease]=${{ contains(github.ref_name, '-') }}
